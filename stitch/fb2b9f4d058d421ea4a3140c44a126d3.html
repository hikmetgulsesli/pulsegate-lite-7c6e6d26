<body class="bg-[#050505] text-on-background font-body-rtf text-body-rtf min-h-screen relative overflow-hidden flex items-center justify-center p-safe-area">

<div class="absolute inset-0 z-0 bg-cover bg-center filter blur-xl opacity-40" data-alt="A dynamic, high-speed neon cyberpunk cityscape viewed from the perspective of an advanced racing cockpit. The scene is bathed in intense cyan, magenta, and lime-green glowing lights against a deep black void background. The aesthetics reflect a digital, aggressive, high-energy arcade racing environment with light trails streaming past to indicate extreme velocity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD7p4HAjYYYq4-_z0x8JFyBuNwpadTkCApkjsYXQZKGp_hQe4tvRfqV0FcSC5IjEly8t5LpkZEyZ2s_8nuFXXUf_k-wA9cnBz4zW6BRi2xln2WIlS0Jt7BX5c4h9_ACqy7fo3EP1uOmfkZW3msIj1aOjDF8Fhw0ZrqITznyK9jHu0Bqn9QXI0YKq8YWiFFeC0xB0KFpxBcg6d_PgXINcRh1H0icC13eHgBjOVPyOqGb05zOv_8e3SMJxU-NTCXSv5G9hxDYXcS0fyU');"></div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-hud-margin py-unit bg-transparent flat no shadows hidden md:flex">
<div class="font-display-lg text-display-lg font-black text-primary drop-shadow-[0_0_10px_rgba(0,219,231,0.8)]">
            PULSEGATE_LITE
        </div>
<div class="flex gap-gutter items-center font-label-caps text-label-caps">
<!-- Settings is Active -->
<button class="text-primary font-bold scale-95 transition-transform duration-150 flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="settings" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
                SETTINGS
            </button>
<button class="text-on-surface-variant hover:text-primary hover:drop-shadow-[0_0_8px_rgba(0,219,231,0.6)] scale-95 transition-transform duration-150 flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="pause">pause</span>
                PAUSE
            </button>
</div>
</header>
<!-- Mobile TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-hud-margin py-unit bg-transparent flat no shadows md:hidden">
<div class="font-display-lg-mobile text-display-lg-mobile font-black text-primary drop-shadow-[0_0_10px_rgba(0,219,231,0.8)]">
            PULSEGATE_LITE
        </div>
<div class="flex gap-gutter items-center font-label-caps text-label-caps">
<button class="text-primary font-bold scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="settings" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
</button>
</div>
</header>
<!-- Settings Panel (Centered Glassmorphic Box) -->
<main class="relative z-10 w-full max-w-2xl bg-surface-container-lowest/80 backdrop-blur-[12px] border border-primary/20 rounded-lg p-panel-padding shadow-[0_0_40px_rgba(0,219,231,0.1)] flex flex-col gap-6">
<!-- Header -->
<div class="flex justify-between items-start border-b border-outline-variant/50 pb-4">
<div>
<h1 class="font-headline-md text-headline-md text-primary tracking-wider uppercase drop-shadow-[0_0_8px_rgba(0,219,231,0.5)]">System Override</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-2">CONFIGURE GAMEPLAY PARAMETERS</p>
</div>
<div class="font-hud-metric text-hud-metric text-tertiary-fixed-dim bg-tertiary-fixed-dim/10 px-3 py-1 rounded border border-tertiary-fixed-dim/30">
                SYS_VER 1.0.2
            </div>
</div>
<!-- Controls Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Left Column: Sliders -->
<div class="flex flex-col gap-6">
<!-- Difficulty Slider -->
<div class="flex flex-col gap-2">
<div class="flex justify-between font-label-caps text-label-caps">
<label class="text-on-surface uppercase">DIFFICULTY</label>
<span class="text-primary-fixed-dim" id="diff-val">STANDARD</span>
</div>
<input class="w-full appearance-none bg-transparent" id="difficulty-slider" max="3" min="1" type="range" value="2"/>
<div class="flex justify-between font-label-caps text-label-caps text-on-surface-variant text-[10px]">
<span>NOVICE</span>
<span>OVERLOAD</span>
</div>
</div>
<!-- Sound Volume -->
<div class="flex flex-col gap-2">
<div class="flex justify-between font-label-caps text-label-caps">
<label class="text-on-surface uppercase flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="volume_up">volume_up</span>
                            MASTER VOLUME
                        </label>
<span class="text-primary-fixed-dim" id="vol-val">80%</span>
</div>
<input class="w-full appearance-none bg-transparent" id="volume-slider" max="100" min="0" type="range" value="80"/>
<!-- Energy Bar Style visual representation -->
<div class="h-1 bg-surface-container-high rounded-full overflow-hidden mt-1">
<div class="h-full bg-primary-fixed-dim shadow-[0_0_8px_rgba(0,219,231,0.8)]" id="vol-bar" style="width: 80%;"></div>
</div>
</div>
</div>
<!-- Right Column: Toggles & Help -->

<!-- Speed Toggle -->
<div class="flex justify-between items-center border-b border-outline-variant/30 pb-4">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface uppercase">HYPER-SPEED</span>
<span class="text-xs text-on-surface-variant mt-1">ENABLE 2X VELOCITY MULTIPLIER</span>
</div>
<!-- Custom Neon Toggle -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-on-surface after:border-outline after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary-container shadow-[0_0_10px_rgba(255,36,228,0.5)]"></div>
</label>

<div class="flex flex-col items-center gap-1">
<div class="w-10 h-10 border border-outline-variant rounded flex items-center justify-center font-hud-metric text-hud-metric text-on-surface bg-surface-container-highest/50 shadow-[inset_0_0_10px_rgba(0,0,0,0.5)]">W</div>
<div class="flex gap-1">
<div class="w-10 h-10 border border-outline-variant rounded flex items-center justify-center font-hud-metric text-hud-metric text-on-surface bg-surface-container-highest/50 shadow-[inset_0_0_10px_rgba(0,0,0,0.5)]">A</div>
<div class="w-10 h-10 border border-outline-variant rounded flex items-center justify-center font-hud-metric text-hud-metric text-on-surface bg-surface-container-highest/50 shadow-[inset_0_0_10px_rgba(0,0,0,0.5)]">S</div>
<div class="w-10 h-10 border border-outline-variant rounded flex items-center justify-center font-hud-metric text-hud-metric text-on-surface bg-surface-container-highest/50 shadow-[inset_0_0_10px_rgba(0,0,0,0.5)]">D</div>
</div>
</div>
</div>
<div class="text-center font-label-caps text-label-caps text-on-surface-variant mt-2">STEER / ACCELERATE</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-4 mt-4 border-t border-outline-variant/50 pt-6">
<button class="flex-1 bg-transparent border-2 border-primary text-primary font-label-caps text-label-caps px-6 py-4 uppercase tracking-widest hover:bg-primary hover:text-on-primary transition-colors duration-200 shadow-[0_0_15px_rgba(0,219,231,0.3)] hover:shadow-[0_0_25px_rgba(0,219,231,0.8)] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
                ACT_SAVE_PREFERENCES
            </button>
<button class="flex-1 bg-surface-container-highest/50 border border-outline-variant text-on-surface font-label-caps text-label-caps px-6 py-4 uppercase tracking-widest hover:bg-surface-container-high hover:border-on-surface transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-outline-variant focus:ring-offset-2 focus:ring-offset-surface">
                ACT_RETURN_TO_GAMEPLAY
            </button>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 w-full flex justify-between px-hud-margin py-unit opacity-50 hover:opacity-100 transition-opacity z-50 bg-transparent flat">
<div class="text-on-surface-variant font-label-caps text-label-caps">
            © 2024 NEON_ARCADE_SYSTEMS
        </div>
<div class="flex gap-gutter text-on-surface-variant font-label-caps text-label-caps">
<a class="hover:text-primary transition-colors" href="#">PRIVACY_PROT</a>
<a class="hover:text-primary transition-colors" href="#">DATA_ENCRYPT</a>
</div>
</footer>
<script>
        // Simple script to update range slider visuals
        const diffSlider = document.getElementById('difficulty-slider');
        const diffVal = document.getElementById('diff-val');
        const diffLabels = ['NOVICE', 'STANDARD', 'OVERLOAD'];

        diffSlider.addEventListener('input', (e) => {
            diffVal.textContent = diffLabels[e.target.value - 1];
        });

        const volSlider = document.getElementById('volume-slider');
        const volVal = document.getElementById('vol-val');
        const volBar = document.getElementById('vol-bar');

        volSlider.addEventListener('input', (e) => {
            volVal.textContent = `${e.target.value}%`;
            volBar.style.width = `${e.target.value}%`;
        });
    </script>
</body></html>
