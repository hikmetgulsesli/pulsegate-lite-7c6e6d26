<style>
        .neon-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(0, 219, 231, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 219, 231, 0.1) 1px, transparent 1px);
            transform: perspective(500px) rotateX(60deg) scale(2);
            transform-origin: top;
            animation: moveGrid 5s linear infinite;
        }

        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 0 40px; }
        }

        .pulse-trail {
            box-shadow: 0 0 20px 5px rgba(0, 219, 231, 0.8), inset 0 0 10px rgba(0, 219, 231, 0.8);
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px 2px rgba(0, 219, 231, 0.5), inset 0 0 5px rgba(0, 219, 231, 0.5); }
            100% { box-shadow: 0 0 30px 10px rgba(0, 219, 231, 0.9), inset 0 0 15px rgba(0, 219, 231, 0.9); }
        }

        .particles {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            background: #e1fdff;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 10s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .glass-panel {
            background: rgba(14, 14, 14, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 219, 231, 0.2);
        }

        .btn-neon {
            border: 2px solid #00dbe7;
            background: transparent;
            box-shadow: 0 0 10px rgba(0, 219, 231, 0.3), inset 0 0 10px rgba(0, 219, 231, 0.1);
            transition: all 0.3s ease;
        }

        .btn-neon:hover {
            background: #00dbe7;
            color: #050505;
            box-shadow: 0 0 20px rgba(0, 219, 231, 0.8), inset 0 0 15px rgba(0, 219, 231, 0.5);
            transform: scale(1.05);
        }
        
        .hud-text {
            text-shadow: 0 0 5px rgba(225, 253, 255, 0.5);
        }
    </style>
</head>

<script>
        // Simple particle generator
        const container = document.getElementById('particle-container');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Randomize properties
            const size = Math.random() * 4 + 1;
            const left = Math.random() * 100;
            const duration = Math.random() * 10 + 5;
            const delay = Math.random() * 10;
            
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}%`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `-${delay}s`;
            
            container.appendChild(particle);
        }
    </script>
